[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fris-reverse-mcp"
version = "0.2.0"
description = "Evidence-oriented static APK analysis for local MCP agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Fris Black Estúdio"}]
dependencies = []

[project.scripts]
fris-reverse = "fris_reverse.__main__:main"

[tool.setuptools.packages.find]
include = ["fris_reverse*"]
